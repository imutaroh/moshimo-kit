<!doctype html>
<!-- 再生機のページの雛形。kinds/sim3d/_common.sh の build_public が {{…}} を埋めて、書き出し用のフォルダに index.html として置く。
     HyperFrames はこのページを開き、時刻を進めながら1コマずつ撮る（GSAP のタイムラインは使わないので data-no-timeline） -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #root {
        position: relative;
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
      }
      #gl,
      #hud {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-no-timeline
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-fps="{{FPS}}"
      data-duration="{{DURATION}}"
      data-start-frame="{{START_FRAME}}"
    >
      <canvas id="gl" width="{{WIDTH}}" height="{{HEIGHT}}"></canvas>
      <div id="hud"></div>
    </div>
    <script type="module" src="./player.js"></script>
  </body>
</html>
